name: Build Fanboy Annoyance uBO

on:
  workflow_dispatch:
  schedule:
    # Once daily at 05:00 UTC.
    - cron: '0 5 * * *'

permissions:
  contents: write

concurrency:
  group: fanboy-annoyance-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out mirror repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install official EasyList renderer
        run: python -m pip install --disable-pip-version-check 'git+https://github.com/adblockplus/python-abp.git@4b0aec2'

      - name: Fetch official EasyList sources
        run: git clone --depth 1 https://github.com/easylist/easylist.git upstream

      - name: Compile combined uBO list with Agegate and Newsletter Shopping
        run: |
          cd upstream

          # Start with the official Fanboy Annoyance uBO template.
          cp fanboy-annoyance-uBO.template combined.template

          # Include Fanboy Agegate.
          # Exclude the duplicate header and repeated includes.
          printf '\n! ---------------- Fanboy Agegate ----------------\n' >> combined.template

          awk '/^%include / && !/template_header[.]txt/ && !seen[$0]++ { print }' \
            fanboy-agegate.template >> combined.template

          # Include Fanboy Newsletter Shopping.
          printf '\n! ---------------- Fanboy Newsletter Shopping ----------------\n' >> combined.template

          cat >> combined.template <<'EOF'
          %include easylist:fanboy-addon/fanboy_newsletter_shopping_specific_hide.txt%
          %include easylist:fanboy-addon/fanboy_newsletter_shopping_specific_uBO.txt%
          EOF

          # Verify all additional sources are included.
          grep -Fq '%include easylist:fanboy-addon/fanboy_agegate_specific_uBO.txt%' combined.template
          grep -Fq '%include easylist:fanboy-addon/fanboy_newsletter_shopping_specific_hide.txt%' combined.template
          grep -Fq '%include easylist:fanboy-addon/fanboy_newsletter_shopping_specific_uBO.txt%' combined.template

          # Render everything into one subscription.
          flrender -i easylist=. combined.template ../fanboy-annoyance.candidate.txt

          # Verify all additional sources appear in the generated output.
          grep -Fq 'fanboy_agegate_specific_uBO.txt' ../fanboy-annoyance.candidate.txt
          grep -Fq 'fanboy_newsletter_shopping_specific_hide.txt' ../fanboy-annoyance.candidate.txt
          grep -Fq 'fanboy_newsletter_shopping_specific_uBO.txt' ../fanboy-annoyance.candidate.txt

      - name: Validate generated list and skip timestamp-only changes
        run: python scripts/validate_and_publish.py fanboy-annoyance.candidate.txt fanboy-annoyance.txt

      - name: Commit new list only when filtering rules change
        run: |
          if git diff --quiet -- fanboy-annoyance.txt && test -f fanboy-annoyance.txt && git ls-files --error-unmatch fanboy-annoyance.txt >/dev/null 2>&1; then
            echo 'No substantive changes. Keeping the last published list.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add fanboy-annoyance.txt

          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi

          git commit -m 'Update Fanboy Annoyance (uBO) filter list'
          git push origin HEAD:${{ github.ref_name }}
